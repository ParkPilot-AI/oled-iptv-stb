# ONYX set-top box: BlueZ settings for game controllers (Settings → Controllers).
# BlueZ reads only /etc/bluetooth/main.conf (no drop-in directory), so this file
# is installed as main.conf; anything not set here keeps BlueZ's default.

[General]
# Classic (BR/EDR) and Low Energy: older Xbox One pads are classic, Series pads
# and recent firmware use Bluetooth LE.
ControllerMode = dual
# Answer page scans faster so a switched-on controller reconnects quickly.
FastConnectable = true
# Let a controller that lost its pairing keys (e.g. paired to a console since)
# pair again without being removed first.
JustWorksRepairing = always
# Use resolvable private addresses only towards devices that support them;
# Xbox controllers with LE firmware reconnect reliably with this.
Privacy = device

[Policy]
# Power the adapter on at boot and when a USB dongle is plugged in.
AutoEnable = true
