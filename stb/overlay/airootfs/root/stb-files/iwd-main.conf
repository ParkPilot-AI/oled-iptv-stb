[General]
EnableNetworkConfiguration=true

[Network]
NameResolvingService=systemd

# Small Realtek USB dongles (rtl8xxxu, e.g. TP-Link TL-WN725N / RTL8188EUS)
# return empty scans with MAC randomization and drop out with power saving.
[Scan]
DisableMacAddressRandomization=true

[DriverQuirks]
PowerSaveDisable=rtl8xxxu,r8188eu,8188eu,rtl8192cu,rtl88x2bu,rtw88_8822bu,rtw88_8821cu
