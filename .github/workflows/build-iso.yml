name: Build set-top box ISO

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['stb/**', 'src/**', 'electron/**', 'package.json', '.github/workflows/build-iso.yml']

permissions:
  contents: write

concurrency:
  group: build-iso
  cancel-in-progress: true

jobs:
  iso:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /

      - name: Build ISO (Arch container + archiso)
        run: sudo ./stb/build.sh

      - name: Checksums
        run: cd stb/out && sha256sum *.iso | tee SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="iso-$(date -u +%Y%m%d-%H%M)"
          gh release create "$tag" stb/out/*.iso stb/out/SHA256SUMS \
            --title "OLED IPTV installer ISO ($tag)" \
            --notes "Write to a USB stick: sudo dd if=<file>.iso of=/dev/sdX bs=4M status=progress oflag=sync — then boot the OptiPlex from it (F12). See stb/README.md."
