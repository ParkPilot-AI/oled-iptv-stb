name: Build set-top box ISO

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['stb/**', 'src/**', 'electron/**', 'package.json', 'electron-builder.yml', '.github/workflows/build-iso.yml']

permissions:
  contents: write

concurrency:
  group: build-iso
  cancel-in-progress: true

jobs:
  iso:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /

      - name: Build ISO (Arch container + archiso)
        run: sudo env BUILD_ID="$(date -u +%Y.%m.%d)-${GITHUB_SHA::7}" GITHUB_REPOSITORY="$GITHUB_REPOSITORY" ./stb/build.sh

      - name: Checksums
        run: sudo chown -R "$USER" stb/out && cd stb/out && sha256sum *.iso oled-iptv-app.tar.zst | tee SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="iso-$(date -u +%Y%m%d-%H%M)"
          gh release create "$tag" stb/out/*.iso stb/out/oled-iptv-app.tar.zst stb/out/app-version.txt stb/out/SHA256SUMS \
            --title "ONYX installer ISO ($tag)" \
            --latest --notes "Installed boxes: Settings → Update system. New install: write to a USB stick: sudo dd if=<file>.iso of=/dev/sdX bs=4M status=progress oflag=sync — then boot the OptiPlex from it (F12). See stb/README.md."
