name: Build set-top box ISO

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    paths: ['stb/**', 'src/**', 'electron/**', 'test/**', 'scripts/**', 'package.json', 'package-lock.json', 'electron-builder.yml', 'eslint.config.js', '.github/workflows/build-iso.yml']

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Installed boxes update from the "latest" release, so nothing is published
  # unless the tests, lint and a renderer build pass first.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1' # tests don't launch Electron
      - run: npm run lint
      - run: npm test
      - run: npm run build:renderer

  iso:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /

      - name: Build ISO (Arch container + archiso)
        run: sudo env BUILD_ID="$(date -u +%Y.%m.%d)-${GITHUB_SHA::7}" GITHUB_REPOSITORY="$GITHUB_REPOSITORY" ./stb/build.sh

      - name: Checksums
        run: sudo chown -R "$USER" stb/out && cd stb/out && sha256sum *.iso oled-iptv-app.tar.zst | tee SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="iso-$(date -u +%Y%m%d-%H%M)"
          gh release create "$tag" stb/out/*.iso stb/out/oled-iptv-app.tar.zst stb/out/app-version.txt stb/out/SHA256SUMS \
            --title "ONYX installer ISO ($tag)" \
            --latest --notes "Installed boxes: Settings → Update system. New install: write to a USB stick: sudo dd if=<file>.iso of=/dev/sdX bs=4M status=progress oflag=sync — then boot the OptiPlex from it (F12). See stb/README.md."
